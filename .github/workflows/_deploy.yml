name: Deploy Bouncer

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag to deploy."
        required: true
        type: string
      build_id:
        description: "Commit SHA to annotate pods with."
        required: true
        type: string
      environment:
        description: "Target environment: staging | qa | dev."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

# Update HELM_CHART_VERSION when the bouncer chart is bumped in DevOps.

env:
  HELM_CHART_VERSION: '5.23.0'
  IMAGE_TAG: ${{ inputs.image_tag }}
  BUILD_ID: ${{ inputs.build_id }}
  ENVIRONMENT: ${{ inputs.environment }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DevOps repo
        uses: actions/checkout@v4
        with:
          repository: 3drepo/DevOps
          token: ${{ secrets.PROJ_MANAGEMENT_TOKEN }}
          sparse-checkout: |
            deployments/asite-${{ inputs.environment == 'staging' && 'stg' || inputs.environment }}/helm/bouncer
            tools/post-deployment
          sparse-checkout-cone-mode: false

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '4.0.1'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.2'

      - name: Login to ACR
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | helm registry login "${{ secrets.REGISTRY_LOGIN_SERVER }}" \
            -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Set up Keeper Secrets Manager CLI
        run: |
          set -euo pipefail
          if ! command -v pipx >/dev/null 2>&1; then
            python3 -m pip install --user --upgrade pipx
            export PATH="$HOME/.local/bin:$PATH"
          fi
          pipx install --force "keeper-secrets-manager-cli==1.5.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy Helm chart (values + kubeconfig from Keeper)
        run: |
          set -euo pipefail

          values_file="$(mktemp)"
          kubeconfig_file="$(mktemp)"
          trap 'rm -f "$values_file" "$kubeconfig_file" "$HOME/.keeper/keeper.ini"' EXIT

          umask 077
          mkdir -p "$HOME/.keeper"
          printf '%s' "${{ secrets.KSM_KEEPER_INIT_FILE_B64 }}" | base64 -d > "$HOME/.keeper/keeper.ini"
          if [[ ! -s "$HOME/.keeper/keeper.ini" ]]; then
            echo "KSM_KEEPER_INIT_FILE_B64 secret is missing or empty" >&2
            exit 1
          fi

          # Target cluster kubeconfig from KSM (per environment), not a GitHub secret.
          # Fail closed on any unexpected environment rather than defaulting to a cluster.
          case "$ENVIRONMENT" in
            staging) kcfg_uid=d3-r_U6ARnrEJwIZm3P9LQ ;;
            qa)      kcfg_uid=cB6kUbMbgSovRGpQ10lQ5w ;;
            dev)     kcfg_uid=C93As_06lV79XkjXeKoMQQ ;;
            *) echo "unsupported environment: '$ENVIRONMENT' (expected staging|qa|dev)" >&2; exit 1 ;;
          esac
          ksm --ini-file "$HOME/.keeper/keeper.ini" secret notation "$kcfg_uid/field/password" | base64 -d > "$kubeconfig_file"
          export KUBECONFIG="$kubeconfig_file"

          values_dir="deployments/asite-${ENVIRONMENT/staging/stg}/helm/bouncer"
          ksm --ini-file "$HOME/.keeper/keeper.ini" interpolate --validate \
            "$values_dir/values.yaml" > "$values_file"

          # staging keeps its original --wait/--rollback safety; qa/dev omit it because
          # helm --wait blocks on KEDA ScaledJob readiness (ISSUE #918).
          wait_args=()
          if [[ "$ENVIRONMENT" == "staging" ]]; then
            wait_args+=(--wait --rollback-on-failure)
          fi

          # Pin client-side apply (not --server-side auto): deterministic across envs and
          # avoids the KEDA-owned ScaledJob field (jobTargetRef...volumes) SSA conflict.
          helm upgrade --install \
            --version ${{ env.HELM_CHART_VERSION }} \
            www-bouncer \
            oci://${{ secrets.REGISTRY_LOGIN_SERVER }}/helm/bouncer \
            --namespace default \
            --server-side=false \
            -f "$values_file" \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --set rollingupdate.enabled=true \
            --set-string podAnnotations.buildId=${{ env.BUILD_ID }} \
            "${wait_args[@]}"

          # Post-deploy health check; flags the job if the release is unhealthy.
          # Retry so KEDA ScaledJobs have time to reach Ready after apply.
          kctx="$(kubectl config current-context)"
          for attempt in 1 2 3 4; do
            if python3 tools/post-deployment/postDeployCheck.py \
                 --context "$kctx" --release www-bouncer --expect-tag "$IMAGE_TAG" --no-logs --no-color; then
              echo "post-deploy check passed"; exit 0
            fi
            echo "post-deploy check attempt $attempt failed; retrying in 45s..."
            sleep 45
          done
          echo "::error::post-deploy check failed for www-bouncer ($ENVIRONMENT)"
          exit 1

      - name: Logout from ACR
        if: always()
        run: helm registry logout "${{ secrets.REGISTRY_LOGIN_SERVER }}"
